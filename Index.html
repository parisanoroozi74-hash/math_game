<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماموریت بزرگ جمع و تفریق</title>

<style>
body{
margin:0;
font-family:tahoma,Arial;
background:linear-gradient(135deg,#06152f,#123d66);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
}

.box{
width:95%;
max-width:700px;
background:#09213d;
border-radius:25px;
padding:25px;
box-shadow:0 0 30px #000;
text-align:center;
}

h1{
color:#ffd21c;
}

input{
width:90%;
padding:15px;
font-size:18px;
border-radius:15px;
border:none;
margin:10px;
}

button{
background:#18b9ff;
border:none;
border-radius:15px;
padding:15px 30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:15px 0;
}

.card{
background:#12365b;
padding:10px;
border-radius:15px;
}

.question{
font-size:45px;
margin:30px;
color:#fff;
}

.hidden{
display:none;
}

.good{
color:#55ff99;
}

.bad{
color:#ff7777;
}
</style>

</head>

<body>

<div class="box">

<div id="start">

<p>آموزگار: خانم نوروزی</p>
<p>دبستان هور</p>

<h1>🚀 ماموریت جمع و تفریق</h1>

<input id="name" placeholder="نام دانش آموز">

<br>

<button onclick="startGame()">شروع بازی</button>

</div>
<div id="game" class="hidden">

<p id="welcome"></p>

<div class="stats">

<div class="card">
مرحله
<h2 id="stage">1</h2>
</div>

<div class="card">
امتیاز
<h2 id="score">0</h2>
</div>

<div class="card">
جان
<h2 id="lives">❤️❤️❤️</h2>
</div>

<div class="card">
درست
<h2 id="correct">0</h2>
</div>

<div class="card">
اشتباه
<h2 id="wrong">0</h2>
</div>

<div class="card">
از ۱۵۰
<h2>🏆</h2>
</div>

</div>

<p id="levelText"></p>

<div class="question" id="question">
</div>

<input
id="answer"
type="number"
placeholder="پاسخ را بنویس"
>

<br>

<button onclick="checkAnswer()">
ثبت پاسخ ✓
</button>

<p id="message"></p>

</div>


<div id="finish" class="hidden">

<h1>🏆 پایان بازی</h1>

<h2 id="finalName"></h2>

<h1 id="finalScore"></h1>

<p>امتیاز نهایی</p>

<h2 id="finalMessage"></h2>

<button onclick="location.reload()">
🔄 بازی دوباره
</button>

</div>

</div>

<script>

let studentName="";
let stage=1;
let score=0;
let lives=3;
let correct=0;
let wrong=0;
let answer=0;

const totalStages=150;

function random(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function startGame(){

studentName=document.getElementById("name").value.trim();

if(studentName==""){
alert("لطفاً نام دانش آموز را وارد کن");
return;
}

document.getElementById("start").classList.add("hidden");

document.getElementById("game").classList.remove("hidden");

document.getElementById("welcome").innerHTML=
"سلام "+studentName+"! 🚀";

newQuestion();

}

function newQuestion(){

let a;
let b;
let operation;

if(stage<=12){

a=random(1,9);
b=random(1,9);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"مرحله ساده: یک رقم با یک رقم";

}

else if(stage<=40){

a=random(10,99);
b=random(1,9);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"دو رقم با یک رقم";

}

else if(stage<=100){

a=random(10,99);
b=random(10,99);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"دو رقم با دو رقم";

}

else{

a=random(10,99);
b=random(100,999);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"دو رقم با سه رقم 🚀";

}

if(operation=="+"){
answer=a+b;
}

else{
answer=a-b;
}

document.getElementById("question").innerHTML=
a+" "+operation+" "+b+" = ؟";

document.getElementById("stage").innerHTML=stage;

document.getElementById("answer").value="";

document.getElementById("message").innerHTML="";

}
