<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماموریت بزرگ جمع و تفریق</title>

<style>
body{
margin:0;
font-family:tahoma,Arial;
background:linear-gradient(135deg,#06152f,#123d66);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
}

.box{
width:95%;
max-width:700px;
background:#09213d;
border-radius:25px;
padding:25px;
box-shadow:0 0 30px #000;
text-align:center;
}

h1{
color:#ffd21c;
}

input{
width:90%;
padding:15px;
font-size:18px;
border-radius:15px;
border:none;
margin:10px;
}

button{
background:#18b9ff;
border:none;
border-radius:15px;
padding:15px 30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:15px 0;
}

.card{
background:#12365b;
padding:10px;
border-radius:15px;
}

.question{
font-size:45px;
margin:30px;
color:#fff;
}

.hidden{
display:none;
}

.good{
color:#55ff99;
}

.bad{
color:#ff7777;
}
</style>

</head>

<body>

<div class="box">

<div id="start">

<p>آموزگار: خانم نوروزی</p>
<p>دبستان هور</p>

<h1>🚀 ماموریت جمع و تفریق</h1>

<input id="name" placeholder="نام دانش آموز">

<br>

<button onclick="startGame()">شروع بازی</button>

</div>
<div id="game" class="hidden">

<p id="welcome"></p>

<div class="stats">

<div class="card">
مرحله
<h2 id="stage">1</h2>
</div>

<div class="card">
امتیاز
<h2 id="score">0</h2>
</div>

<div class="card">
جان
<h2 id="lives">❤️❤️❤️</h2>
</div>

<div class="card">
درست
<h2 id="correct">0</h2>
</div>

<div class="card">
اشتباه
<h2 id="wrong">0</h2>
</div>

<div class="card">
از ۱۵۰
<h2>🏆</h2>
</div>

</div>

<p id="levelText"></p>

<div class="question" id="question">
</div>

<input
id="answer"
type="number"
placeholder="پاسخ را بنویس"
>

<br>

<button onclick="checkAnswer()">
ثبت پاسخ ✓
</button>

<p id="message"></p>

</div>


<div id="finish" class="hidden">

<h1>🏆 پایان بازی</h1>

<h2 id="finalName"></h2>

<h1 id="finalScore"></h1>

<p>امتیاز نهایی</p>

<h2 id="finalMessage"></h2>

<button onclick="location.reload()">
🔄 بازی دوباره
</button>

</div>

</div>

<script>

let studentName="";
let stage=1;
let score=0;
let lives=3;
let correct=0;
let wrong=0;
let answer=0;

const totalStages=150;

function random(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function startGame(){

studentName=document.getElementById("name").value.trim();

if(studentName==""){
alert("لطفاً نام دانش آموز را وارد کن");
return;
}

document.getElementById("start").classList.add("hidden");

document.getElementById("game").classList.remove("hidden");

document.getElementById("welcome").innerHTML=
"سلام "+studentName+"! 🚀";

newQuestion();

}

function newQuestion(){

let a;
let b;
let operation;

if(stage<=12){

a=random(1,9);
b=random(1,9);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"مرحله ساده: یک رقم با یک رقم";

}

else if(stage<=40){

a=random(10,99);
b=random(1,9);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"دو رقم با یک رقم";

}

else if(stage<=100){

a=random(10,99);
b=random(10,99);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"دو رقم با دو رقم";

}

else{

a=random(10,99);
b=random(100,999);

operation=Math.random()<0.5?"+":"-";

if(operation=="-" && b>a){
let temp=a;
a=b;
b=temp;
}

document.getElementById("levelText").innerHTML=
"دو رقم با سه رقم 🚀";

}

if(operation=="+"){
answer=a+b;
}

else{
answer=a-b;
}

document.getElementById("question").innerHTML=
a+" "+operation+" "+b+" = ؟";

document.getElementById("stage").innerHTML=stage;

document.getElementById("answer").value="";

document.getElementById("message").innerHTML="";

}
function checkAnswer(){

let userAnswer=document.getElementById("answer").value;

if(userAnswer==""){
alert("پاسخ را وارد کن");
return;
}

let message=document.getElementById("message");

if(Number(userAnswer)===answer){

correct++;

score+=10;

message.innerHTML="🎉 آفرین! پاسخ درست بود";

message.className="good";

playGoodSound();

}else{

wrong++;

lives--;

message.innerHTML=
"😔 اشتباه بود! پاسخ درست: "+answer;

message.className="bad";

playBadSound();

}

document.getElementById("score").innerHTML=score;

document.getElementById("lives").innerHTML=
"❤️".repeat(lives)+"🖤".repeat(3-lives);

document.getElementById("correct").innerHTML=correct;

document.getElementById("wrong").innerHTML=wrong;

setTimeout(function(){

if(lives<=0){

finishGame();

return;

}

if(stage>=totalStages){

finishGame();

return;

}

stage++;

newQuestion();

},1500);

}


function playGoodSound(){

try{

let audio=new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

audio.play();

}catch(e){}

}


function playBadSound(){

try{

let audio=new Audio(
"https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"
);

audio.play();

}catch(e){}

}


function finishGame(){

document.getElementById("game").classList.add("hidden");

document.getElementById("finish").classList.remove("hidden");

document.getElementById("finalName").innerHTML=
"آفرین "+studentName+"!";

document.getElementById("finalScore").innerHTML=
score+" امتیاز ⭐";

if(stage>=totalStages){

document.getElementById("finalMessage").innerHTML=
"🚀🏆 تبریک! تو هر ۱۵۰ مرحله را انجام دادی!";

}else{

document.getElementById("finalMessage").innerHTML=
"💪 بازی تمام شد! دوباره تلاش کن و رکوردت را بهتر کن.";

}

saveRecord();

showRecords();

}


function saveRecord(){

let records=
JSON.parse(localStorage.getItem("mathRecords")||"[]");

records.push({

name:studentName,

score:score,

stage:stage

});

records.sort(function(a,b){

return b.score-a.score;

});

records=records.slice(0,10);

localStorage.setItem(
"mathRecords",
JSON.stringify(records)
);

}


function showRecords(){

let records=
JSON.parse(localStorage.getItem("mathRecords")||"[]");

let html="<h2>🏆 جدول رکوردها</h2>";

html+="<div class='stats'>";

for(let i=0;i<records.length;i++){

html+="<div class='card'>";

html+=(i+1)+"️⃣ "+records[i].name;

html+="<br>⭐ "+records[i].score;

html+="<br>مرحله "+records[i].stage;

html+="</div>";

}

html+="</div>";

document.getElementById("finish").innerHTML+=html;

}


document
.getElementById("answer")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

checkAnswer();

}

});

</script>

</body>

</html>
